name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# One release at a time so two quick merges never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' || echo v0.0.0)
          subjects=$(git log "$last..HEAD" --no-merges --format=%s)
          if [ -z "$subjects" ]; then
            echo "Nothing new since $last; skipping release."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          # Conventional commits: feat or a breaking change bumps minor (pre-1.0), anything else bumps patch.
          if grep -qE '^feat(\(.+\))?!?:|^[a-z]+(\(.+\))?!:' <<< "$subjects"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
  release:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path macos
      - name: Import Developer ID certificate
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "No Developer ID certificate configured; building an ad-hoc signed pre-release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Build app and DMG
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/notary.p8', runner.temp) || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          scripts/build_mac_app.sh
          scripts/make_dmg.sh
          (cd dist && shasum -a 256 *.dmg > "lautli-${VERSION#v}.dmg.sha256")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          notes="Download the DMG, drag lautli to Applications and follow the README."
          # Unsigned builds are still Latest: the README download link points at /releases/latest.
          flags=(--generate-notes --target "$GITHUB_SHA" --latest)
          if [ "$SIGNED" != "true" ]; then
            notes="$notes This build is not notarized: on first launch, Control-click the app and choose Open (see README)."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.sha256 --title "lautli $TAG" --notes "$notes" "${flags[@]}"
          fi
