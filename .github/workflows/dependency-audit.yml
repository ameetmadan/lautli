# SEC-001. Separate from CI so the weekly run doesn't re-run lint/test/build;
# advisories land without code changes and only the schedule catches them.
name: Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v6
      # Reads the lockfile only, so no install is needed. Dev-only tooling never ships.
      - if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm audit --prod --audit-level=high

      - if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - if: hashFiles('requirements.txt') != ''
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt
